<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pirate Slash</title>
<style>

:root[data-theme="dark"]{--bg:#0c2236;--bg2:#12466b;--ink:#eaf6ff;--card:#17344d;--sub:#9db8cc;--sea1:#1d5a85;--sea2:#0f3a5c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}

.scr[hidden]{display:none}

.sub{text-align:center;color:var(--sub);margin:0 0 10px}
.card{background:var(--card);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.card p{margin:6px 0;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:0;border-radius:999px;padding:8px 12px;font:inherit;font-weight:700;background:var(--sea1);color:#12314a;cursor:pointer}
.chip.o0{background:var(--blue);color:#fff}.chip.o1{background:var(--red);color:#fff}

.go{background:#f08a00}.alt{background:#5a6f86}
.hud{display:flex;gap:8px;justify-content:space-between;font-weight:800}
.pill{background:var(--card);border-radius:999px;padding:5px 12px}
.prompt{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:8px 12px;margin:8px 0;min-height:84px}

</style></head><body><main id="app">

<section id="home" class="scr">
<button class="snd" id="snd">🔊</button>
<h1>⚔️ Pirate Slash</h1>

<div class="card">

<p id="legend"></p>
<p id="modes"></p>
<p>❤️ Có 3 tim. Chém sai, chém bom 💣 hoặc để đáp án đúng trôi mất sẽ mất 1 tim.</p>
</div>
<div class="card"><div class="chips" id="vocab"></div><p class="sub" style="margin:8px 0 0">Bấm vào từ để nghe</p></div>
<button class="big go" id="start">⚓ Bắt đầu!</button>
<p class="sub" id="best" style="margin-top:10px"></p>
</section>

<section id="play" class="scr" hidden>
<div class="hud"><span class="pill" id="lv"></span><span class="pill" id="st"></span><span class="pill" id="sc"></span></div>
<div class="prompt"><div class="pic" id="pic"></div><div class="pt"><div id="ins"></div><b id="qq"></b></div><button id="sp" aria-label="Nghe">🔊</button></div>
<canvas id="cv"></canvas>
<div class="fb" id="fb"></div>
</section>

<section id="end" class="scr" hidden>
<h1>Hết tim rồi! 💔</h1>
<div class="rank" id="rank"></div>
<div class="card"><div class="stats"><div><b id="e1"></b>điểm</div><div><b id="e2"></b>câu đúng</div><div><b id="e3"></b>chuỗi dài nhất</div></div><p class="sub" id="e4" style="margin-top:10px"></p></div>
<button class="big go" id="again">🔁 Chơi lại</button>
<button class="big alt" id="home2" style="margin-top:10px">🏠 Về trang chủ</button>
</section>
</main>

 else if(r.mode==="ask"){pic.className="pic";pic.textContent=r.it[1];ins.textContent="✂️ Chém câu trả lời đúng cho:";qq.textContent=r.q;sp.style.display="";speak(r.q)}
 else if(r.mode==="sent"){pic.className=oc;pic.innerHTML=lb;ins.textContent="✂️ Chém CÂU hỏi đúng với hình và màu cờ!"}
 else if(r.mode==="ans"){pic.className=oc;pic.innerHTML=lb;ins.textContent="✂️ Chém câu trả lời đúng cho:";qq.textContent=r.q;sp.style.display="";speak(r.q)}
 else{pic.className="pic";pic.textContent="👂";ins.textContent="👂 Nghe rồi chém HÌNH đúng màu cờ!";sp.style.display="";speak(r.say)}}
function nextRound(){
 if(!S.on)return;var md=modesAvail(),m=(S.n===0&&md.indexOf("word")>=0)?"word":pick(md.length>1?md.filter(function(x){return x!==S.lastMode}):md);

/* game */
function hud(){$("lv").textContent="❤️".repeat(Math.max(0,S.lives))+"🖤".repeat(3-Math.max(0,S.lives));$("sc").textContent="💰 "+S.score;$("st").textContent="🔥 "+S.streak+(mult()>1?" ×"+mult():"")}

 S.items.splice(S.items.indexOf(it),1);

 floatT(it.x,it.y,"+"+add+" 💰","#ffd34d");$("fb").className="fb ok";$("fb").textContent="🎉 "+(r.mode==="word"||r.mode==="hear"?r.it[1]+" "+r.ans:r.ans)+"  +"+add;beep(660,.12);speak(r.ans);hud();setTimeout(nextRound,1100)}

 $("e1").textContent=sc;$("e2").textContent=S.right;$("e3").textContent=S.bs;$("e4").textContent=nb&&sc>0?"🌟 Kỷ lục mới!":"Điểm cao nhất: "+best;show("end")}

 else if(f.length>=2&&f[0]&&!/^[A-Za-z0-9]/.test(f[0])){var ws=f[1].split("/").map(function(x){return x.trim()});w.push([ws[0],f[0],ws[1]||ws[0],f[2]&&f[2]!=="-"?f[2]:"",g])}});
 return {w:w,a:a,fl:fl}}
